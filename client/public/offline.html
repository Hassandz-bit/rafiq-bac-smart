<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#071421" />
    <title>رفيق الباك — دون اتصال</title>
    <style>
      :root { color-scheme: dark; font-family: Arial, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at top, #123262, #071421 58%); color: #f8fbff; }
      main { width: min(31rem, calc(100% - 2rem)); box-sizing: border-box; padding: 2.25rem; border: 1px solid rgba(150, 220, 255, .24); border-radius: 1.5rem; background: rgba(7, 20, 33, .8); text-align: center; box-shadow: 0 1.25rem 4rem rgba(0, 0, 0, .25); }
      .mark { width: 3.5rem; height: 3.5rem; margin: 0 auto 1rem; display: grid; place-items: center; border-radius: 1.2rem; color: #071421; background: #44d8d1; font-size: 1.5rem; }
      h1 { margin: 0; font-size: 1.5rem; } p { margin: 1rem 0 0; color: #c2d3e5; line-height: 1.9; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">✦</div>
      <h1>أنت خارج الاتصال حاليًا</h1>
      <p>أعد الاتصال بالإنترنت ثم حدّث الصفحة لمتابعة الدروس والبيانات المحمية بأمان.</p>
    </main>
  </body>
</html>
